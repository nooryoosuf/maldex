name: Deploy Maldex to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Runs daily at 12:00 UTC (17:00 Malé Time / MVT, after MSE market close)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      sync_data:
        description: "Fetch fresh data from MSE, CMDA, MMA & World Bank before deploying"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync live data from MSE, CMDA, MMA & World Bank
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_data != false)
        run: npm run sync:data

      - name: Commit updated data snapshots to master
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_data != false)
        run: |
          if [ -n "$(git status --porcelain src/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "chore(data): automated daily data sync ($(date -u +'%Y-%m-%d %H:%M UTC')) [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          else
            echo "No changes in src/data to commit."
          fi

      - name: Build static site
        run: npm run build

      - name: Ensure .nojekyll exists
        run: touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
